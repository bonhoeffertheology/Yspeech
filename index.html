<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Yspeech Prompter</title>
  <style>
    :root {
      --bg-color: #0b0c10;
      --text-muted: #4a5568;
      --text-highlight: #ffffff;
      --read-color: #1e293b;
      --font-size: 36px;
      --line-height: 2.1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg-color);
      color: var(--text-muted);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background: #12141a;
      border-bottom: 1px solid #20242f;
      z-index: 10;
    }
    .controls-group { display: flex; align-items: center; gap: 10px; }
    .icon-btn {
      width: 42px; height: 42px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 1px solid #2d3342;
      background: #181b24;
      color: #e2e8f0;
      transition: all 0.15s ease;
    }
    .icon-btn svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 2; }
    .icon-btn.active { background: #fff; border-color: #fff; }
    .icon-btn.active svg { stroke: #000; fill: #000; }
    .stepper-group {
      display: inline-flex;
      align-items: center;
      background: #12141a;
      border: 1px solid #242936;
      border-radius: 8px;
      padding: 2px 4px;
    }
    .stepper-label { font-size: 13px; color: #717c91; padding-left: 6px; }
    .stepper-btn {
      width: 32px; height: 32px;
      font-size: 18px;
      border: none;
      background: transparent;
      color: #e2e8f0;
      cursor: pointer;
    }
    .stepper-value { min-width: 40px; text-align: center; font-size: 14px; font-weight: 600; color: #f1f5f9; }
    #prompter-container {
      flex: 1;
      overflow-y: scroll;
      padding: 25vh 14vw 75vh 14vw;
      scrollbar-width: none;
      position: relative;
    }
    #prompter-container::-webkit-scrollbar { display: none; }
    #prompter-text { font-size: var(--font-size); line-height: var(--line-height); word-break: keep-all; }
    .word { display: inline; padding: 2px 3px; border-radius: 4px; transition: color 0.15s, background 0.15s; }
    .word.read { color: var(--read-color); }
    .word.active { color: var(--text-highlight); font-weight: 700; background: rgba(255,255,255,0.1); }
    .word.upcoming { color: var(--text-muted); }
    #floating-scrollbar {
      position: absolute; right: 6px; top: 64px; bottom: 38px; width: 32px;
      z-index: 15; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    #floating-scrollbar.visible { opacity: 1; pointer-events: auto; }
    #scroll-thumb {
      position: absolute; top: 0; right: 8px; width: 6px; background: #475569;
      border-radius: 4px; cursor: pointer;
    }
    #status-bar {
      padding: 8px 20px; font-size: 13px; background: #090a0e; color: #555f73;
      display: flex; justify-content: space-between; border-top: 1px solid #181b24;
    }
  </style>
</head>
<body>

  <header>
    <div class="controls-group">
      <button id="btn-toggle" class="icon-btn">
        <svg id="icon-mic" viewBox="0 0 24 24">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
        <svg id="icon-stop" viewBox="0 0 24 24" style="display: none;">
          <rect x="4" y="4" width="16" height="16" rx="2"></rect>
        </svg>
      </button>
    </div>
    <div class="controls-group">
      <div class="stepper-group">
        <span class="stepper-label">크기</span>
        <button class="stepper-btn" id="btn-font-dec">−</button>
        <span class="stepper-value" id="val-font-size">36</span>
        <button class="stepper-btn" id="btn-font-inc">+</button>
      </div>
      <div class="stepper-group">
        <span class="stepper-label">줄간격</span>
        <button class="stepper-btn" id="btn-line-dec">−</button>
        <span class="stepper-value" id="val-line-height">2.1</span>
        <button class="stepper-btn" id="btn-line-inc">+</button>
      </div>
    </div>
  </header>

  <div id="prompter-container">
    <div id="prompter-text"></div>
  </div>

  <div id="floating-scrollbar">
    <div id="scroll-thumb"></div>
  </div>

  <div id="status-bar">
    <span id="speech-preview">준비됨</span>
    <span id="progress-counter">0 / 0</span>
  </div>

  <script>
    const DEFAULT_SCRIPT = `안녕하세요. 안드로이드 온디바이스 전용 프롬프터입니다.
갤럭시 탭 S9의 자체 오프라인 음성 인식 엔진과 연동되어 딜레이 없이 실시간으로 단어를 추적합니다.
클라우드 서버 통신 없이 기기 내부의 One UI 음성 엔진이 직접 단어를 감지합니다.`;

    const state = {
      words: [],
      currentIndex: 0,
      targetScrollTop: 0,
      isListening: false
    };

    const container = document.getElementById('prompter-container');
    const textContainer = document.getElementById('prompter-text');
    const btnToggle = document.getElementById('btn-toggle');
    const iconMic = document.getElementById('icon-mic');
    const iconStop = document.getElementById('icon-stop');
    const speechPreview = document.getElementById('speech-preview');
    const progressCounter = document.getElementById('progress-counter');

    function normalizeWord(str) {
      return str.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?"'<>]/g, "").trim().toLowerCase();
    }

    function parseScript(rawText) {
      const tokens = [];
      const lines = rawText.split('\n');
      lines.forEach((line, lineIdx) => {
        const wordsInLine = line.trim().split(/\s+/);
        wordsInLine.forEach((w) => {
          if (w.length > 0) tokens.push({ raw: w, clean: normalizeWord(w), isLineBreak: false });
        });
        if (lineIdx < lines.length - 1 && tokens.length > 0) tokens[tokens.length - 1].isLineBreak = true;
      });
      return tokens;
    }

    function renderTokens() {
      textContainer.innerHTML = '';
      state.words.forEach((token, idx) => {
        const span = document.createElement('span');
        span.className = 'word upcoming';
        span.innerText = token.raw + ' ';
        span.dataset.index = idx;
        span.addEventListener('click', () => setWordIndex(idx));
        textContainer.appendChild(span);
        if (token.isLineBreak) {
          textContainer.appendChild(document.createElement('br'));
          textContainer.appendChild(document.createElement('br'));
        }
      });
      setWordIndex(0);
    }

    function setWordIndex(idx) {
      if (idx < 0 || idx >= state.words.length) return;
      state.currentIndex = idx;
      const spans = textContainer.querySelectorAll('.word');
      spans.forEach((s, i) => {
        if (i < idx) s.className = 'word read';
        else if (i === idx) s.className = 'word active';
        else s.className = 'word upcoming';
      });
      progressCounter.innerText = `${state.currentIndex + 1} / ${state.words.length}`;
      updateTargetScroll();
    }

    function updateTargetScroll() {
      const activeSpan = textContainer.querySelector(`.word[data-index="${state.currentIndex}"]`);
      if (!activeSpan) return;
      const offset = activeSpan.getBoundingClientRect().top - container.getBoundingClientRect().top;
      const targetFocusLine = container.clientHeight * 0.25; // 상단 25% 지점
      state.targetScrollTop = container.scrollTop + (offset - targetFocusLine);
    }

    function smoothScrollLoop() {
      const diff = state.targetScrollTop - container.scrollTop;
      if (Math.abs(diff) > 0.5) container.scrollTop += diff * 0.1;
      requestAnimationFrame(smoothScrollLoop);
    }
    requestAnimationFrame(smoothScrollLoop);

    // 네이티브 앱에서 실시간 단어를 쏴줄 때 호출되는 글로벌 함수
    window.onNativeSpeechResult = function(recognizedText) {
      speechPreview.innerText = `🗣️ ${recognizedText.slice(-20)}`;
      const incomingWords = recognizedText.trim().split(/\s+/).map(normalizeWord).filter(Boolean);
      if (incomingWords.length === 0) return;

      const lastWord = incomingWords[incomingWords.length - 1];
      const start = Math.max(0, state.currentIndex - 2);
      const end = Math.min(state.words.length, state.currentIndex + 14);

      for (let i = start; i < end; i++) {
        const targetClean = state.words[i].clean;
        if (targetClean === lastWord || (lastWord.length >= 2 && targetClean.includes(lastWord))) {
          setWordIndex(i);
          return;
        }
      }
    };

    // 버튼 동작: 안드로이드 네이티브 앱의 브릿지 호출
    btnToggle.addEventListener('click', () => {
      state.isListening = !state.isListening;
      if (state.isListening) {
        btnToggle.classList.add('active');
        iconMic.style.display = 'none';
        iconStop.style.display = 'block';
        if (window.AndroidBridge) {
          window.AndroidBridge.startSpeechRecognition();
        }
      } else {
        btnToggle.classList.remove('active');
        iconMic.style.display = 'block';
        iconStop.style.display = 'none';
        if (window.AndroidBridge) {
          window.AndroidBridge.stopSpeechRecognition();
        }
      }
    });

    // 외부 스크립트 주입 인터페이스
    window.loadScriptFromYslide = function(text) {
      state.words = parseScript(text);
      renderTokens();
    };

    window.addEventListener('DOMContentLoaded', () => {
      state.words = parseScript(DEFAULT_SCRIPT);
      renderTokens();
    });
  </script>
</body>
</html>
