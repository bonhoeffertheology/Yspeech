<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Yspeech - Smart Prompter</title>
  <style>
    :root {
      --bg-color: #0b0c10;
      --text-muted: #4a5568;
      --text-highlight: #ffffff;
      --accent-color: #3b82f6;
      --read-color: #1e293b;
      --font-size: 36px;
      --line-height: 2.1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-muted);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* 상단 컨트롤 헤더 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background: #141721;
      border-bottom: 1px solid #232936;
      gap: 12px;
      z-index: 10;
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* 아이콘 전용 버튼 스타일 */
    .icon-btn {
      width: 44px;
      height: 44px;
      padding: 0;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 1px solid #333d52;
      background: #1e2330;
      color: #e2e8f0;
      transition: all 0.15s ease;
      font-size: 20px;
      user-select: none;
    }

    .icon-btn:active {
      transform: scale(0.92);
      background: #2b3347;
    }

    .icon-btn.primary {
      background: var(--accent-color);
      border-color: var(--accent-color);
    }

    .icon-btn.active {
      background: #ef4444;
      border-color: #ef4444;
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    /* 수치 조절 스텝퍼 */
    .stepper-group {
      display: inline-flex;
      align-items: center;
      background: #0d0f17;
      border: 1px solid #283042;
      border-radius: 8px;
      padding: 2px 4px;
      gap: 2px;
    }

    .stepper-label {
      font-size: 13px;
      color: #94a3b8;
      padding-left: 6px;
    }

    .stepper-btn {
      width: 32px;
      height: 32px;
      padding: 0;
      font-size: 18px;
      border: none;
      background: transparent;
      color: #cbd5e1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
    }

    .stepper-btn:active {
      background: #1e293b;
    }

    .stepper-value {
      min-width: 40px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      color: #e2e8f0;
      font-variant-numeric: tabular-nums;
    }

    /* 본문 프롬프터 뷰포트 */
    #prompter-container {
      flex: 1;
      overflow-y: scroll;
      padding: 25vh 14vw 75vh 14vw;
      scrollbar-width: none;
      position: relative;
    }

    #prompter-container::-webkit-scrollbar {
      display: none;
    }

    #prompter-text {
      font-size: var(--font-size);
      line-height: var(--line-height);
      word-break: keep-all;
      word-wrap: break-word;
    }

    /* 단어 토큰 */
    .word {
      display: inline;
      padding: 2px 3px;
      border-radius: 4px;
      transition: color 0.15s ease, background 0.15s ease;
      cursor: pointer;
    }

    .word.read {
      color: var(--read-color);
    }

    .word.active {
      color: var(--text-highlight);
      font-weight: 700;
      background: rgba(59, 130, 246, 0.22);
    }

    .word.upcoming {
      color: var(--text-muted);
    }

    /* 태블릿용 플로팅 스크롤바 (Fast-Scroll Track & Thumb) */
    #floating-scrollbar {
      position: absolute;
      right: 6px;
      top: 64px;
      bottom: 38px;
      width: 32px; /* 터치하기 편한 충분한 영역 */
      z-index: 15;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    #floating-scrollbar.visible {
      opacity: 1;
      pointer-events: auto;
    }

    #scroll-thumb {
      position: absolute;
      top: 0;
      right: 8px;
      width: 8px;
      background: #475569;
      border-radius: 6px;
      cursor: pointer;
      transition: width 0.2s, background 0.2s;
    }

    #floating-scrollbar:active #scroll-thumb,
    #scroll-thumb:active {
      width: 14px;
      background: var(--accent-color);
    }

    /* 원고 수정 모달 */
    #editor-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 30;
      padding: 24px;
      flex-direction: column;
    }

    #editor-modal.open {
      display: flex;
    }

    textarea {
      flex: 1;
      background: #11141c;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
      font-size: 18px;
      line-height: 1.6;
      resize: none;
      outline: none;
      margin-bottom: 16px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    .modal-btn {
      padding: 10px 20px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      border: 1px solid #334155;
      background: #1e2330;
      color: #e2e8f0;
    }

    .modal-btn.primary {
      background: var(--accent-color);
      border-color: var(--accent-color);
      color: #fff;
    }

    /* 하단 상태바 */
    #status-bar {
      padding: 8px 20px;
      font-size: 13px;
      background: #08090d;
      color: #64748b;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid #161a24;
      z-index: 10;
    }
  </style>
</head>
<body>

  <header>
    <div class="controls-group">
      <!-- 텍스트 없이 아이콘만 배치 -->
      <button id="btn-toggle" class="icon-btn primary" title="음성 인식 시작">🎙️</button>
      <button id="btn-edit" class="icon-btn" title="원고 수정">✏️</button>
    </div>
    
    <div class="controls-group">
      <!-- 글자 크기 조절 -->
      <div class="stepper-group">
        <span class="stepper-label">크기</span>
        <button class="stepper-btn" id="btn-font-dec">−</button>
        <span class="stepper-value" id="val-font-size">36</span>
        <button class="stepper-btn" id="btn-font-inc">+</button>
      </div>

      <!-- 줄 간격 조절 -->
      <div class="stepper-group">
        <span class="stepper-label">줄간격</span>
        <button class="stepper-btn" id="btn-line-dec">−</button>
        <span class="stepper-value" id="val-line-height">2.1</span>
        <button class="stepper-btn" id="btn-line-inc">+</button>
      </div>
    </div>
  </header>

  <div id="prompter-container">
    <div id="prompter-text"></div>
  </div>

  <!-- 화면 터치/스크롤 시 노출되는 플로팅 스크롤바 -->
  <div id="floating-scrollbar">
    <div id="scroll-thumb"></div>
  </div>

  <div id="status-bar">
    <span id="speech-preview">준비됨</span>
    <span id="progress-counter">0 / 0</span>
  </div>

  <!-- 원고 수정 창 -->
  <div id="editor-modal">
    <textarea id="script-input" placeholder="발표 원고를 입력하세요..."></textarea>
    <div class="modal-actions">
      <button id="btn-cancel" class="modal-btn">취소</button>
      <button id="btn-save" class="modal-btn primary">적용</button>
    </div>
  </div>

  <script>
    const DEFAULT_SCRIPT = `안녕하세요. 오늘 발표를 시작하겠습니다.
상단 버튼은 텍스트 없이 간결한 아이콘으로 구성되었습니다.
화면을 터치하거나 스크롤하면 오른쪽에 플로팅 스크롤바가 나타납니다.
핸들을 손가락으로 드래그하면 방대한 양의 원고도 빠르게 이동하여 확인할 수 있습니다.
또한 이 프로그램은 Yslide와 즉시 연동되도록 인터페이스가 마련되어 있습니다.
Yslide에서 넘겨받은 스크립트를 곧바로 프롬프터로 띄워 발표를 진행해 보세요.`;

    const state = {
      words: [],
      currentIndex: 0,
      targetScrollTop: 0,
      isListening: false,
      isDraggingThumb: false,
      recognition: null,
      fontSize: 36,
      lineHeight: 2.1,
      fadeTimer: null
    };

    const container = document.getElementById('prompter-container');
    const textContainer = document.getElementById('prompter-text');
    const btnToggle = document.getElementById('btn-toggle');
    const btnEdit = document.getElementById('btn-edit');
    const modal = document.getElementById('editor-modal');
    const scriptInput = document.getElementById('script-input');
    const btnSave = document.getElementById('btn-save');
    const btnCancel = document.getElementById('btn-cancel');
    const speechPreview = document.getElementById('speech-preview');
    const progressCounter = document.getElementById('progress-counter');

    const floatingScrollbar = document.getElementById('floating-scrollbar');
    const scrollThumb = document.getElementById('scroll-thumb');

    const btnFontDec = document.getElementById('btn-font-dec');
    const btnFontInc = document.getElementById('btn-font-inc');
    const valFontSize = document.getElementById('val-font-size');
    const btnLineDec = document.getElementById('btn-line-dec');
    const btnLineInc = document.getElementById('btn-line-inc');
    const valLineHeight = document.getElementById('val-line-height');

    function normalizeWord(str) {
      return str.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?"'<>]/g, "").trim().toLowerCase();
    }

    function parseScript(rawText) {
      const tokens = [];
      const lines = rawText.split('\n');

      lines.forEach((line, lineIdx) => {
        const wordsInLine = line.trim().split(/\s+/);
        wordsInLine.forEach((w) => {
          if (w.length > 0) {
            tokens.push({
              raw: w,
              clean: normalizeWord(w),
              isLineBreak: false
            });
          }
        });
        if (lineIdx < lines.length - 1 && tokens.length > 0) {
          tokens[tokens.length - 1].isLineBreak = true;
        }
      });
      return tokens;
    }

    function renderTokens() {
      textContainer.innerHTML = '';
      state.words.forEach((token, idx) => {
        const span = document.createElement('span');
        span.className = 'word upcoming';
        span.innerText = token.raw + ' ';
        span.dataset.index = idx;

        span.addEventListener('click', () => {
          setWordIndex(idx);
        });

        textContainer.appendChild(span);

        if (token.isLineBreak) {
          textContainer.appendChild(document.createElement('br'));
          textContainer.appendChild(document.createElement('br'));
        }
      });

      setWordIndex(0);
      updateTargetScroll();
      updateThumbPosition();
    }

    function setWordIndex(idx) {
      if (idx < 0 || idx >= state.words.length) return;
      state.currentIndex = idx;

      const spans = textContainer.querySelectorAll('.word');
      spans.forEach((s, i) => {
        if (i < idx) {
          s.className = 'word read';
        } else if (i === idx) {
          s.className = 'word active';
        } else {
          s.className = 'word upcoming';
        }
      });

      progressCounter.innerText = `${state.currentIndex + 1} / ${state.words.length}`;
      if (!state.isDraggingThumb) {
        updateTargetScroll();
      }
    }

    function updateTargetScroll() {
      const activeSpan = textContainer.querySelector(`.word[data-index="${state.currentIndex}"]`);
      if (!activeSpan) return;

      const spanRect = activeSpan.getBoundingClientRect();
      const containerRect = container.getBoundingClientRect();
      
      const currentScroll = container.scrollTop;
      const offset = spanRect.top - containerRect.top;
      const targetFocusLine = container.clientHeight * 0.25; // 상단 25% 지점

      state.targetScrollTop = currentScroll + (offset - targetFocusLine);
    }

    // 선형 보간 스크롤 애니메이션 루프
    function smoothScrollLoop() {
      if (!state.isDraggingThumb) {
        const diff = state.targetScrollTop - container.scrollTop;
        if (Math.abs(diff) > 0.5) {
          container.scrollTop += diff * 0.08;
        }
      }
      requestAnimationFrame(smoothScrollLoop);
    }
    requestAnimationFrame(smoothScrollLoop);

    // --- 플로팅 스크롤바 동작 로직 ---
    function showScrollbar() {
      floatingScrollbar.classList.add('visible');
      clearTimeout(state.fadeTimer);
      if (!state.isDraggingThumb) {
        state.fadeTimer = setTimeout(() => {
          floatingScrollbar.classList.remove('visible');
        }, 1500);
      }
    }

    function updateThumbPosition() {
      const scrollHeight = container.scrollHeight;
      const clientHeight = container.clientHeight;
      const trackHeight = floatingScrollbar.clientHeight;

      if (scrollHeight <= clientHeight) {
        scrollThumb.style.display = 'none';
        return;
      }
      scrollThumb.style.display = 'block';

      // 썸 높이 계산 (최소 40px)
      const thumbHeight = Math.max(40, (clientHeight / scrollHeight) * trackHeight);
      scrollThumb.style.height = `${thumbHeight}px`;

      // 썸 탑 위치 계산
      const maxScrollTop = scrollHeight - clientHeight;
      const currentScrollRatio = container.scrollTop / maxScrollTop;
      const maxThumbTop = trackHeight - thumbHeight;
      const thumbTop = currentScrollRatio * maxThumbTop;

      scrollThumb.style.top = `${thumbTop}px`;
    }

    // 컨테이너 스크롤 시 썸 동기화 및 페이드인
    container.addEventListener('scroll', () => {
      if (!state.isDraggingThumb) {
        updateThumbPosition();
        showScrollbar();
      }
    });

    // 플로팅 썸 터치 드래그 이벤트 (모바일/태블릿 및 마우스 지원)
    function handleThumbMove(clientY) {
      const trackRect = floatingScrollbar.getBoundingClientRect();
      const trackHeight = floatingScrollbar.clientHeight;
      const thumbHeight = scrollThumb.offsetHeight;
      const maxThumbTop = trackHeight - thumbHeight;

      let relativeY = clientY - trackRect.top - (thumbHeight / 2);
      relativeY = Math.max(0, Math.min(maxThumbTop, relativeY));

      const ratio = relativeY / maxThumbTop;
      const maxScrollTop = container.scrollHeight - container.clientHeight;
      
      container.scrollTop = ratio * maxScrollTop;
      state.targetScrollTop = container.scrollTop;
      scrollThumb.style.top = `${relativeY}px`;
    }

    function onPointerDown(e) {
      state.isDraggingThumb = true;
      showScrollbar();
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      handleThumbMove(clientY);

      const onPointerMove = (moveEvent) => {
        const y = moveEvent.touches ? moveEvent.touches[0].clientY : moveEvent.clientY;
        handleThumbMove(y);
      };

      const onPointerUp = () => {
        state.isDraggingThumb = false;
        showScrollbar();
        window.removeEventListener('mousemove', onPointerMove);
        window.removeEventListener('mouseup', onPointerUp);
        window.removeEventListener('touchmove', onPointerMove);
        window.removeEventListener('touchend', onPointerUp);
      };

      window.addEventListener('mousemove', onPointerMove);
      window.addEventListener('mouseup', onPointerUp);
      window.addEventListener('touchmove', onPointerMove, { passive: false });
      window.addEventListener('touchend', onPointerUp);
    }

    floatingScrollbar.addEventListener('mousedown', onPointerDown);
    floatingScrollbar.addEventListener('touchstart', onPointerDown, { passive: false });

    // 실시간 음성 매칭 엔진
    function processRealtimeSpeech(transcript) {
      if (!transcript) return;
      const incomingWords = transcript.trim().split(/\s+/).map(normalizeWord).filter(Boolean);
      if (incomingWords.length === 0) return;

      const lastWord = incomingWords[incomingWords.length - 1];
      const lookAheadRange = 12;
      const start = Math.max(0, state.currentIndex - 2);
      const end = Math.min(state.words.length, state.currentIndex + lookAheadRange);

      for (let i = start; i < end; i++) {
        const targetClean = state.words[i].clean;
        if (targetClean === lastWord || (lastWord.length >= 2 && targetClean.includes(lastWord))) {
          setWordIndex(i);
          return;
        }
      }
    }

    // Web Speech API
    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        speechPreview.innerText = "음성 인식을 지원하지 않는 브라우저입니다.";
        btnToggle.disabled = true;
        return;
      }

      const rec = new SpeechRecognition();
      rec.continuous = true;
      rec.interimResults = true;
      rec.lang = 'ko-KR';

      rec.onresult = (event) => {
        let interimText = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          interimText += event.results[i][0].transcript;
        }
        speechPreview.innerText = `🗣️ ${interimText.slice(-25)}`;
        processRealtimeSpeech(interimText);
      };

      rec.onerror = (e) => {
        console.warn("Speech API 오류 무시:", e.error);
      };

      rec.onend = () => {
        if (state.isListening) {
          try { rec.start(); } catch (e) {}
        }
      };

      state.recognition = rec;
    }

    function startListening() {
      if (!state.recognition) initSpeechRecognition();
      state.isListening = true;
      try { state.recognition.start(); } catch(e) {}
      btnToggle.innerText = '⏹️';
      btnToggle.classList.add('active');
      speechPreview.innerText = "듣고 있습니다...";
    }

    function stopListening() {
      state.isListening = false;
      if (state.recognition) {
        try { state.recognition.stop(); } catch(e) {}
      }
      btnToggle.innerText = '🎙️';
      btnToggle.classList.remove('active');
      speechPreview.innerText = "정지됨";
    }

    // 폰트 및 줄간격 제어
    function setFontSize(newVal) {
      state.fontSize = Math.min(64, Math.max(20, newVal));
      valFontSize.innerText = state.fontSize;
      document.documentElement.style.setProperty('--font-size', `${state.fontSize}px`);
      updateTargetScroll();
      updateThumbPosition();
    }

    function setLineHeight(newVal) {
      state.lineHeight = Math.min(3.2, Math.max(1.4, parseFloat(newVal.toFixed(1))));
      valLineHeight.innerText = state.lineHeight.toFixed(1);
      document.documentElement.style.setProperty('--line-height', state.lineHeight);
      updateTargetScroll();
      updateThumbPosition();
    }

    btnFontDec.addEventListener('click', () => setFontSize(state.fontSize - 2));
    btnFontInc.addEventListener('click', () => setFontSize(state.fontSize + 2));
    btnLineDec.addEventListener('click', () => setLineHeight(state.lineHeight - 0.1));
    btnLineInc.addEventListener('click', () => setLineHeight(state.lineHeight + 0.1));

    btnToggle.addEventListener('click', () => {
      if (state.isListening) stopListening();
      else startListening();
    });

    btnEdit.addEventListener('click', () => {
      scriptInput.value = state.words.map(w => w.raw + (w.isLineBreak ? '\n' : ' ')).join('').trim();
      modal.classList.add('open');
    });

    btnSave.addEventListener('click', () => {
      const val = scriptInput.value.trim();
      if (val) {
        state.words = parseScript(val);
        renderTokens();
      }
      modal.classList.remove('open');
    });

    btnCancel.addEventListener('click', () => {
      modal.classList.remove('open');
    });

    window.addEventListener('resize', () => {
      updateTargetScroll();
      updateThumbPosition();
    });

    // --- Yslide 외부 연동 전역 API ---
    window.YslidePrompter = {
      // 1. 외부에서 직접 호출: window.YslidePrompter.loadScript("새로운 원고...");
      loadScript: function(scriptText) {
        if (!scriptText) return;
        state.words = parseScript(scriptText);
        renderTokens();
        speechPreview.innerText = "Yslide 원고 동기화 완료";
      },
      start: startListening,
      stop: stopListening,
      setIndex: setWordIndex
    };

    // 2. iframe / 부모 창 postMessage 연동 지원
    window.addEventListener('message', (event) => {
      if (!event.data) return;
      if (event.data.type === 'SET_PROMPTER_SCRIPT') {
        window.YslidePrompter.loadScript(event.data.script);
      }
    });

    // 초기 실행
    window.addEventListener('DOMContentLoaded', () => {
      state.words = parseScript(DEFAULT_SCRIPT);
      renderTokens();
      initSpeechRecognition();
    });
  </script>
</body>
</html>
