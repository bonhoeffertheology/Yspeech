<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Smart Voice Prompter</title>
  <style>
    :root {
      --bg-color: #0b0c10;
      --text-muted: #4a5568;
      --text-highlight: #ffffff;
      --accent-color: #3b82f6;
      --read-color: #1e293b;
      --font-size: 34px;
      --line-height: 2.1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-muted);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 헤더 컨트롤 바 */
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      background: #141721;
      border-bottom: 1px solid #232936;
      gap: 12px;
      z-index: 10;
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    button {
      background: #1e2330;
      color: #e2e8f0;
      border: 1px solid #333d52;
      padding: 10px 18px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    button:active {
      transform: scale(0.97);
    }

    button.primary {
      background: var(--accent-color);
      border-color: var(--accent-color);
      color: #fff;
    }

    button.active {
      background: #ef4444;
      border-color: #ef4444;
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #94a3b8;
      font-size: 14px;
    }

    input[type="range"] {
      cursor: pointer;
      accent-color: var(--accent-color);
    }

    /* 스크립트 뷰포트 */
    #prompter-container {
      flex: 1;
      overflow-y: scroll;
      padding: 40vh 14vw 60vh 14vw; /* 중앙 시선 정렬용 여백 */
      scrollbar-width: none;
    }

    #prompter-container::-webkit-scrollbar {
      display: none;
    }

    #prompter-text {
      font-size: var(--font-size);
      line-height: var(--line-height);
      word-break: keep-all;
      word-wrap: break-word;
    }

    /* 단어 단위 스팬 스타일 */
    .word {
      display: inline;
      padding: 2px 3px;
      border-radius: 4px;
      transition: color 0.15s ease, background 0.15s ease;
      cursor: pointer;
    }

    .word.read {
      color: var(--read-color);
    }

    .word.active {
      color: var(--text-highlight);
      font-weight: 700;
      background: rgba(59, 130, 246, 0.2);
    }

    .word.upcoming {
      color: var(--text-muted);
    }

    /* 원고 수정 모달 */
    #editor-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 20;
      padding: 24px;
      flex-direction: column;
    }

    #editor-modal.open {
      display: flex;
    }

    textarea {
      flex: 1;
      background: #11141c;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
      font-size: 18px;
      line-height: 1.6;
      resize: none;
      outline: none;
      margin-bottom: 16px;
    }

    /* 하단 상태바 */
    #status-bar {
      padding: 8px 24px;
      font-size: 13px;
      background: #08090d;
      color: #64748b;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid #161a24;
    }
  </style>
</head>
<body>

  <header>
    <div class="controls-group">
      <button id="btn-toggle" class="primary">🎙️ 인식 시작</button>
      <button id="btn-edit">✏️ 원고 수정</button>
    </div>
    
    <div class="controls-group">
      <div class="slider-container">
        <label for="font-size">글자 크기</label>
        <input type="range" id="font-size" min="22" max="64" value="34" />
      </div>
      <button id="btn-reset">처음으로</button>
    </div>
  </header>

  <div id="prompter-container">
    <div id="prompter-text"></div>
  </div>

  <div id="status-bar">
    <span id="speech-preview">준비됨</span>
    <span id="progress-counter">0 / 0</span>
  </div>

  <!-- 원고 수정 창 -->
  <div id="editor-modal">
    <textarea id="script-input" placeholder="발표 원고를 입력하세요..."></textarea>
    <div style="display:flex; justify-content: flex-end; gap: 12px;">
      <button id="btn-cancel">취소</button>
      <button id="btn-save" class="primary">적용하기</button>
    </div>
  </div>

  <script>
    const DEFAULT_SCRIPT = `안녕하세요. 오늘 프롬프터 시스템 시연을 시작하겠습니다.
엘가토 프롬프터처럼 말을 시작하면 단어의 흐름에 맞추어 스크롤이 부드럽고 자연스럽게 실시간으로 올라갑니다.
말을 끝까지 맺지 않아도 중간 발화 내용을 실시간으로 분석하여 목표 위치를 따라갑니다.
만약 말을 조금 더 빨리 하더라도 스크립트가 유연하게 가속하여 발표자의 속도를 쫓아옵니다.
태블릿 터치를 통해 언제든지 읽고 싶은 위치를 직접 선택하여 이동할 수도 있습니다.
준비되셨다면 원고 수정 버튼을 눌러 실제 발표 원고를 입력해 보세요.`;

    const state = {
      words: [],            // 원본 단어 객체 배열
      currentIndex: 0,
      targetScrollTop: 0,
      isListening: false,
      recognition: null,
      keepAliveTimer: null
    };

    const container = document.getElementById('prompter-container');
    const textContainer = document.getElementById('prompter-text');
    const btnToggle = document.getElementById('btn-toggle');
    const btnEdit = document.getElementById('btn-edit');
    const btnReset = document.getElementById('btn-reset');
    const modal = document.getElementById('editor-modal');
    const scriptInput = document.getElementById('script-input');
    const btnSave = document.getElementById('btn-save');
    const btnCancel = document.getElementById('btn-cancel');
    const speechPreview = document.getElementById('speech-preview');
    const progressCounter = document.getElementById('progress-counter');
    const fontSizeSlider = document.getElementById('font-size');

    // 특수문자 제거 후 순수 단어 토큰 추출
    function normalizeWord(str) {
      return str.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?"'<>]/g, "").trim().toLowerCase();
    }

    // 텍스트 파싱 (단어 단위 분할 및 줄바꿈 보존)
    function parseScript(rawText) {
      const tokens = [];
      const lines = rawText.split('\n');

      lines.forEach((line, lineIdx) => {
        const wordsInLine = line.trim().split(/\s+/);
        wordsInLine.forEach((w) => {
          if (w.length > 0) {
            tokens.push({
              raw: w,
              clean: normalizeWord(w),
              isLineBreak: false
            });
          }
        });
        if (lineIdx < lines.length - 1 && tokens.length > 0) {
          tokens[tokens.length - 1].isLineBreak = true;
        }
      });
      return tokens;
    }

    function renderTokens() {
      textContainer.innerHTML = '';
      state.words.forEach((token, idx) => {
        const span = document.createElement('span');
        span.className = 'word upcoming';
        span.innerText = token.raw + ' ';
        span.dataset.index = idx;

        // 터치/클릭 즉각 동기화
        span.addEventListener('click', () => {
          setWordIndex(idx);
        });

        textContainer.appendChild(span);

        if (token.isLineBreak) {
          textContainer.appendChild(document.createElement('br'));
          textContainer.appendChild(document.createElement('br'));
        }
      });

      setWordIndex(0);
      updateTargetScroll();
    }

    function setWordIndex(idx) {
      if (idx < 0 || idx >= state.words.length) return;
      state.currentIndex = idx;

      const spans = textContainer.querySelectorAll('.word');
      spans.forEach((s, i) => {
        if (i < idx) {
          s.className = 'word read';
        } else if (i === idx) {
          s.className = 'word active';
        } else {
          s.className = 'word upcoming';
        }
      });

      progressCounter.innerText = `${state.currentIndex + 1} / ${state.words.length}`;
      updateTargetScroll();
    }

    // 활성 단어의 위치를 읽어 목표 스크롤 위치 계산
    function updateTargetScroll() {
      const activeSpan = textContainer.querySelector(`.word[data-index="${state.currentIndex}"]`);
      if (!activeSpan) return;

      const spanRect = activeSpan.getBoundingClientRect();
      const containerRect = container.getBoundingClientRect();
      
      // 현재 컨테이너 스크롤 값 + 대상 엘리먼트의 상대 오프셋 - 화면 중앙점
      const currentScroll = container.scrollTop;
      const offset = spanRect.top - containerRect.top;
      const centerLine = container.clientHeight * 0.38; // 상단 38% 지점에 시선 맞춤

      state.targetScrollTop = currentScroll + (offset - centerLine);
    }

    // 선형 보간을 활용한 부드러운 스크롤 루프 (Lerp Scroll)
    function smoothScrollLoop() {
      const diff = state.targetScrollTop - container.scrollTop;
      if (Math.abs(diff) > 0.5) {
        // 프레임당 8%씩 완만하게 목표치로 접근
        container.scrollTop += diff * 0.08;
      }
      requestAnimationFrame(smoothScrollLoop);
    }
    requestAnimationFrame(smoothScrollLoop);

    // 실시간 음성 단어 매칭 엔진
    function processRealtimeSpeech(transcript) {
      if (!transcript) return;
      
      const incomingWords = transcript.trim().split(/\s+/).map(normalizeWord).filter(Boolean);
      if (incomingWords.length === 0) return;

      const lastWord = incomingWords[incomingWords.length - 1];

      // 현재 읽는 위치를 기준으로 앞뒤 8개 단어 반경 탐색
      const lookAheadRange = 12;
      const start = Math.max(0, state.currentIndex - 2);
      const end = Math.min(state.words.length, state.currentIndex + lookAheadRange);

      for (let i = start; i < end; i++) {
        const targetClean = state.words[i].clean;
        
        // 끝말 일치 혹은 포함 관계 탐색
        if (targetClean === lastWord || (lastWord.length >= 2 && targetClean.includes(lastWord))) {
          setWordIndex(i);
          return;
        }
      }
    }

    // Web Speech API 초기화
    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        speechPreview.innerText = "Web Speech API 미지원 브라우저";
        btnToggle.disabled = true;
        return;
      }

      const rec = new SpeechRecognition();
      rec.continuous = true;
      rec.interimResults = true; // 실시간 발화 캐치
      rec.lang = 'ko-KR';

      rec.onresult = (event) => {
        let interimText = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          const part = event.results[i][0].transcript;
          interimText += part;
        }
        
        speechPreview.innerText = `🗣️ ${interimText.slice(-25)}`;
        // 중간 발화 도중에도 즉시 위치 갱신
        processRealtimeSpeech(interimText);
      };

      // 팝업 없이 조용하게 오류 처리 및 세션 유지
      rec.onerror = (e) => {
        console.warn("Speech API 상태:", e.error);
      };

      rec.onend = () => {
        // 사용자가 명시적으로 정지하지 않았다면 조용히 재연결
        if (state.isListening) {
          try {
            rec.start();
          } catch (e) {}
        }
      };

      state.recognition = rec;
    }

    function startListening() {
      if (!state.recognition) initSpeechRecognition();
      state.isListening = true;
      try {
        state.recognition.start();
      } catch(e) {}
      btnToggle.innerText = '⏹️ 인식 정지';
      btnToggle.classList.add('active');
      speechPreview.innerText = "듣고 있습니다...";
    }

    function stopListening() {
      state.isListening = false;
      if (state.recognition) {
        try {
          state.recognition.stop();
        } catch(e) {}
      }
      btnToggle.innerText = '🎙️ 인식 시작';
      btnToggle.classList.remove('active');
      speechPreview.innerText = "정지됨";
    }

    // 이벤트 리스너
    btnToggle.addEventListener('click', () => {
      if (state.isListening) stopListening();
      else startListening();
    });

    btnReset.addEventListener('click', () => {
      setWordIndex(0);
    });

    btnEdit.addEventListener('click', () => {
      scriptInput.value = state.words.map(w => w.raw + (w.isLineBreak ? '\n' : ' ')).join('').trim();
      modal.classList.add('open');
    });

    btnSave.addEventListener('click', () => {
      const val = scriptInput.value.trim();
      if (val) {
        state.words = parseScript(val);
        renderTokens();
      }
      modal.classList.remove('open');
    });

    btnCancel.addEventListener('click', () => {
      modal.classList.remove('open');
    });

    fontSizeSlider.addEventListener('input', (e) => {
      document.documentElement.style.setProperty('--font-size', `${e.target.value}px`);
      updateTargetScroll();
    });

    window.addEventListener('resize', () => {
      updateTargetScroll();
    });

    // 시작
    window.addEventListener('DOMContentLoaded', () => {
      state.words = parseScript(DEFAULT_SCRIPT);
      renderTokens();
      initSpeechRecognition();
    });
  </script>
</body>
</html>
