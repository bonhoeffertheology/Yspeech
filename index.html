<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Smart Voice Prompter</title>
  <style>
    :root {
      --bg-color: #0b0c10;
      --text-muted: #4a5568;
      --text-highlight: #ffffff;
      --accent-color: #3b82f6;
      --read-color: #1e293b;
      --font-size: 36px;
      --line-height: 2.1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-muted);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 상단 헤더 */
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background: #141721;
      border-bottom: 1px solid #232936;
      gap: 12px;
      z-index: 10;
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      background: #1e2330;
      color: #e2e8f0;
      border: 1px solid #333d52;
      padding: 8px 14px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      user-select: none;
    }

    button:active {
      transform: scale(0.95);
      background: #2b3347;
    }

    button.primary {
      background: var(--accent-color);
      border-color: var(--accent-color);
      color: #fff;
    }

    button.active {
      background: #ef4444;
      border-color: #ef4444;
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    /* 숫자 스테퍼 (크기, 줄간격) */
    .stepper-group {
      display: inline-flex;
      align-items: center;
      background: #0d0f17;
      border: 1px solid #283042;
      border-radius: 8px;
      padding: 2px 4px;
      gap: 4px;
    }

    .stepper-label {
      font-size: 13px;
      color: #94a3b8;
      padding-left: 6px;
    }

    .stepper-btn {
      width: 32px;
      height: 32px;
      padding: 0;
      font-size: 18px;
      line-height: 1;
      border-radius: 6px;
    }

    .stepper-value {
      min-width: 44px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      color: #e2e8f0;
      font-variant-numeric: tabular-nums;
    }

    /* 본문 프롬프터 영역 */
    #prompter-container {
      flex: 1;
      overflow-y: scroll;
      /* 상단은 타겟 위치에 맞게 28vh 여백, 하단은 넉넉하게 75vh 여백 */
      padding: 28vh 14vw 75vh 14vw;
      scrollbar-width: none;
      position: relative;
    }

    #prompter-container::-webkit-scrollbar {
      display: none;
    }

    #prompter-text {
      font-size: var(--font-size);
      line-height: var(--line-height);
      word-break: keep-all;
      word-wrap: break-word;
    }

    /* 단어 토큰 스타일 */
    .word {
      display: inline;
      padding: 2px 3px;
      border-radius: 4px;
      transition: color 0.15s ease, background 0.15s ease;
      cursor: pointer;
    }

    .word.read {
      color: var(--read-color);
    }

    .word.active {
      color: var(--text-highlight);
      font-weight: 700;
      background: rgba(59, 130, 246, 0.22);
    }

    .word.upcoming {
      color: var(--text-muted);
    }

    /* 원고 수정 모달 */
    #editor-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 20;
      padding: 24px;
      flex-direction: column;
    }

    #editor-modal.open {
      display: flex;
    }

    textarea {
      flex: 1;
      background: #11141c;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
      font-size: 18px;
      line-height: 1.6;
      resize: none;
      outline: none;
      margin-bottom: 16px;
    }

    /* 하단 상태바 */
    #status-bar {
      padding: 8px 24px;
      font-size: 13px;
      background: #08090d;
      color: #64748b;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid #161a24;
    }
  </style>
</head>
<body>

  <header>
    <div class="controls-group">
      <button id="btn-toggle" class="primary">🎙️ 인식 시작</button>
      <button id="btn-edit">✏️ 원고 수정</button>
      <button id="btn-reset">처음으로</button>
    </div>
    
    <div class="controls-group">
      <!-- 글자 크기 스텝퍼 -->
      <div class="stepper-group">
        <span class="stepper-label">크기</span>
        <button class="stepper-btn" id="btn-font-dec">−</button>
        <span class="stepper-value" id="val-font-size">36</span>
        <button class="stepper-btn" id="btn-font-inc">+</button>
      </div>

      <!-- 줄 간격 스텝퍼 -->
      <div class="stepper-group">
        <span class="stepper-label">줄간격</span>
        <button class="stepper-btn" id="btn-line-dec">−</button>
        <span class="stepper-value" id="val-line-height">2.1</span>
        <button class="stepper-btn" id="btn-line-inc">+</button>
      </div>
    </div>
  </header>

  <div id="prompter-container">
    <div id="prompter-text"></div>
  </div>

  <div id="status-bar">
    <span id="speech-preview">준비됨</span>
    <span id="progress-counter">0 / 0</span>
  </div>

  <!-- 원고 수정 창 -->
  <div id="editor-modal">
    <textarea id="script-input" placeholder="발표 원고를 입력하세요..."></textarea>
    <div style="display:flex; justify-content: flex-end; gap: 12px;">
      <button id="btn-cancel">취소</button>
      <button id="btn-save" class="primary">적용하기</button>
    </div>
  </div>

  <script>
    const DEFAULT_SCRIPT = `안녕하세요. 오늘 발표를 시작하겠습니다.
이제 프롬프터의 시선 기준선이 화면 가운데보다 15% 위인 상단 25% 지점에 배치됩니다.
덕분에 말을 조금 빠르게 진행하더라도 아래에 읽을 원고를 훨씬 넓은 시야로 미리 확인할 수 있습니다.
화면 상단의 플러스 마이너스 버튼을 눌러 글자 크기와 줄 간격을 태블릿 화면에 가장 편안한 상태로 맞춰보세요.
인식 도중 언제든 원하는 단어를 터치하여 즉시 위치를 이동할 수도 있습니다.`;

    const state = {
      words: [],
      currentIndex: 0,
      targetScrollTop: 0,
      isListening: false,
      recognition: null,
      fontSize: 36,
      lineHeight: 2.1
    };

    const container = document.getElementById('prompter-container');
    const textContainer = document.getElementById('prompter-text');
    const btnToggle = document.getElementById('btn-toggle');
    const btnEdit = document.getElementById('btn-edit');
    const btnReset = document.getElementById('btn-reset');
    const modal = document.getElementById('editor-modal');
    const scriptInput = document.getElementById('script-input');
    const btnSave = document.getElementById('btn-save');
    const btnCancel = document.getElementById('btn-cancel');
    const speechPreview = document.getElementById('speech-preview');
    const progressCounter = document.getElementById('progress-counter');

    // UI 스텝퍼 요소
    const btnFontDec = document.getElementById('btn-font-dec');
    const btnFontInc = document.getElementById('btn-font-inc');
    const valFontSize = document.getElementById('val-font-size');

    const btnLineDec = document.getElementById('btn-line-dec');
    const btnLineInc = document.getElementById('btn-line-inc');
    const valLineHeight = document.getElementById('val-line-height');

    function normalizeWord(str) {
      return str.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?"'<>]/g, "").trim().toLowerCase();
    }

    function parseScript(rawText) {
      const tokens = [];
      const lines = rawText.split('\n');

      lines.forEach((line, lineIdx) => {
        const wordsInLine = line.trim().split(/\s+/);
        wordsInLine.forEach((w) => {
          if (w.length > 0) {
            tokens.push({
              raw: w,
              clean: normalizeWord(w),
              isLineBreak: false
            });
          }
        });
        if (lineIdx < lines.length - 1 && tokens.length > 0) {
          tokens[tokens.length - 1].isLineBreak = true;
        }
      });
      return tokens;
    }

    function renderTokens() {
      textContainer.innerHTML = '';
      state.words.forEach((token, idx) => {
        const span = document.createElement('span');
        span.className = 'word upcoming';
        span.innerText = token.raw + ' ';
        span.dataset.index = idx;

        span.addEventListener('click', () => {
          setWordIndex(idx);
        });

        textContainer.appendChild(span);

        if (token.isLineBreak) {
          textContainer.appendChild(document.createElement('br'));
          textContainer.appendChild(document.createElement('br'));
        }
      });

      setWordIndex(0);
      updateTargetScroll();
    }

    function setWordIndex(idx) {
      if (idx < 0 || idx >= state.words.length) return;
      state.currentIndex = idx;

      const spans = textContainer.querySelectorAll('.word');
      spans.forEach((s, i) => {
        if (i < idx) {
          s.className = 'word read';
        } else if (i === idx) {
          s.className = 'word active';
        } else {
          s.className = 'word upcoming';
        }
      });

      progressCounter.innerText = `${state.currentIndex + 1} / ${state.words.length}`;
      updateTargetScroll();
    }

    // 목표 스크롤 계산: 가운데(50%)보다 15% 더 위인 [상단 25% 지점]에 맞춤
    function updateTargetScroll() {
      const activeSpan = textContainer.querySelector(`.word[data-index="${state.currentIndex}"]`);
      if (!activeSpan) return;

      const spanRect = activeSpan.getBoundingClientRect();
      const containerRect = container.getBoundingClientRect();
      
      const currentScroll = container.scrollTop;
      const offset = spanRect.top - containerRect.top;
      
      // 화면 높이의 25%를 기준 라인으로 삼아 아래쪽 원고 시야를 75% 확보
      const targetFocusLine = container.clientHeight * 0.25; 

      state.targetScrollTop = currentScroll + (offset - targetFocusLine);
    }

    // 부드러운 스크롤 애니메이션 루프
    function smoothScrollLoop() {
      const diff = state.targetScrollTop - container.scrollTop;
      if (Math.abs(diff) > 0.5) {
        container.scrollTop += diff * 0.08;
      }
      requestAnimationFrame(smoothScrollLoop);
    }
    requestAnimationFrame(smoothScrollLoop);

    // 실시간 음성 매칭 엔진
    function processRealtimeSpeech(transcript) {
      if (!transcript) return;
      
      const incomingWords = transcript.trim().split(/\s+/).map(normalizeWord).filter(Boolean);
      if (incomingWords.length === 0) return;

      const lastWord = incomingWords[incomingWords.length - 1];

      // 현재 인덱스 기준 앞뒤 반경 내에서 탐색
      const lookAheadRange = 12;
      const start = Math.max(0, state.currentIndex - 2);
      const end = Math.min(state.words.length, state.currentIndex + lookAheadRange);

      for (let i = start; i < end; i++) {
        const targetClean = state.words[i].clean;
        if (targetClean === lastWord || (lastWord.length >= 2 && targetClean.includes(lastWord))) {
          setWordIndex(i);
          return;
        }
      }
    }

    // Web Speech API
    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        speechPreview.innerText = "음성 인식을 지원하지 않는 브라우저입니다.";
        btnToggle.disabled = true;
        return;
      }

      const rec = new SpeechRecognition();
      rec.continuous = true;
      rec.interimResults = true;
      rec.lang = 'ko-KR';

      rec.onresult = (event) => {
        let interimText = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          interimText += event.results[i][0].transcript;
        }
        speechPreview.innerText = `🗣️ ${interimText.slice(-25)}`;
        processRealtimeSpeech(interimText);
      };

      rec.onerror = (e) => {
        console.warn("Speech API 상태:", e.error);
      };

      rec.onend = () => {
        if (state.isListening) {
          try {
            rec.start();
          } catch (e) {}
        }
      };

      state.recognition = rec;
    }

    function startListening() {
      if (!state.recognition) initSpeechRecognition();
      state.isListening = true;
      try {
        state.recognition.start();
      } catch(e) {}
      btnToggle.innerText = '⏹️ 인식 정지';
      btnToggle.classList.add('active');
      speechPreview.innerText = "듣고 있습니다...";
    }

    function stopListening() {
      state.isListening = false;
      if (state.recognition) {
        try {
          state.recognition.stop();
        } catch(e) {}
      }
      btnToggle.innerText = '🎙️ 인식 시작';
      btnToggle.classList.remove('active');
      speechPreview.innerText = "정지됨";
    }

    // 스타일 제어 함수
    function setFontSize(newVal) {
      state.fontSize = Math.min(64, Math.max(20, newVal));
      valFontSize.innerText = state.fontSize;
      document.documentElement.style.setProperty('--font-size', `${state.fontSize}px`);
      updateTargetScroll();
    }

    function setLineHeight(newVal) {
      state.lineHeight = Math.min(3.2, Math.max(1.4, parseFloat(newVal.toFixed(1))));
      valLineHeight.innerText = state.lineHeight.toFixed(1);
      document.documentElement.style.setProperty('--line-height', state.lineHeight);
      updateTargetScroll();
    }

    // 글자 크기 +/- 버튼
    btnFontDec.addEventListener('click', () => setFontSize(state.fontSize - 2));
    btnFontInc.addEventListener('click', () => setFontSize(state.fontSize + 2));

    // 줄 간격 +/- 버튼
    btnLineDec.addEventListener('click', () => setLineHeight(state.lineHeight - 0.1));
    btnLineInc.addEventListener('click', () => setLineHeight(state.lineHeight + 0.1));

    // 버튼 이벤트 리스너
    btnToggle.addEventListener('click', () => {
      if (state.isListening) stopListening();
      else startListening();
    });

    btnReset.addEventListener('click', () => {
      setWordIndex(0);
    });

    btnEdit.addEventListener('click', () => {
      scriptInput.value = state.words.map(w => w.raw + (w.isLineBreak ? '\n' : ' ')).join('').trim();
      modal.classList.add('open');
    });

    btnSave.addEventListener('click', () => {
      const val = scriptInput.value.trim();
      if (val) {
        state.words = parseScript(val);
        renderTokens();
      }
      modal.classList.remove('open');
    });

    btnCancel.addEventListener('click', () => {
      modal.classList.remove('open');
    });

    window.addEventListener('resize', () => {
      updateTargetScroll();
    });

    // 시작 초기화
    window.addEventListener('DOMContentLoaded', () => {
      state.words = parseScript(DEFAULT_SCRIPT);
      renderTokens();
      initSpeechRecognition();
    });
  </script>
</body>
</html>
